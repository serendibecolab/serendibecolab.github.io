[build]
  command = "pnpm build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  command = "pnpm dev"
  port = 8888
  targetPort = 4321

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

# Enable Netlify Forms on all HTML pages
[template.environment]
  NETLIFY = "true"
